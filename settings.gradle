pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = 'quickjs-wrapper'
if (gradle.startParameter.taskNames.any { it.tokenize(':').last() == 'verifyAndroidApi' }) {
    include ':androidApi'
    project(':androidApi').projectDir = file('checks/android-api')
}
if (providers.gradleProperty('androidRuntime').getOrElse('false').toBoolean()) include ':runtime'

if (file('tests/settings.gradle').isFile()) apply from: 'tests/settings.gradle'
