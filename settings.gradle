pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = 'quickjs-wrapper'
if (providers.gradleProperty('androidRuntime').getOrElse('false').toBoolean()) include ':runtime'

if (file('tests/settings.gradle').isFile()) apply from: 'tests/settings.gradle'
